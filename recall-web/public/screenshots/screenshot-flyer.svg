    <text x="230" y="26" fill="#526078" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700">COMPENSATION</text>
    <text x="230" y="54" fill="#4A8BDF" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="900">₹18.00 LPA</text>
