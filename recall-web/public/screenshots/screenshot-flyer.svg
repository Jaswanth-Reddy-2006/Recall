  <text x="56" y="71" fill="#4A8BDF" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">TC</text>
  
  <text x="98" y="55" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="1">TECHCORP GLOBAL</text>
  <text x="98" y="78" fill="#EFFAFD" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">UNIVERSITY RECRUITMENT PROGRAM 2026</text>

