  <!-- Header Banner (Solid Royal Blue) -->
  <rect x="0" y="0" width="480" height="130" rx="16 16 0 0" fill="#4A8BDF"/>
  <rect x="0" y="116" width="480" height="14" fill="#2459A8"/>

